<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>esbuild-server 客户端</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; background: #1e1e1e; color: #eee; overflow: hidden; }
    #app { display: grid; grid-template-columns: 200px 1fr 1fr; grid-template-rows: 32px 1fr 200px; height: 100vh; gap: 1px; background: #333; }
    header { grid-column: 1 / 4; background: #252526; padding: 6px 12px; font-size: 13px; line-height: 20px; display: flex; align-items: center; gap: 12px; }
    header .status { font-size: 12px; color: #8b8; }
    header .status.err { color: #f48771; }
    #files { background: #252526; overflow: auto; font-size: 12px; }
    #files ul { list-style: none; margin: 0; padding: 4px 0; }
    #files li { padding: 3px 10px; cursor: pointer; white-space: nowrap; color: #ccc; }
    #files li:hover { background: #2a2d2e; }
    #files li.active { background: #094771; color: #fff; }
    #files li.dirty::after { content: ' ●'; color: #e5c07b; }
    #editor { background: #1e1e1e; min-width: 0; }
    #preview { background: #fff; overflow: hidden; }
    #preview iframe { width: 100%; height: 100%; border: 0; }
    #log { grid-column: 1 / 4; background: #1e1e1e; color: #d4d4d4; font: 12px/1.4 Consolas, monospace; padding: 6px 10px; overflow: auto; white-space: pre-wrap; }
    .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #888; font-size: 13px; }
    .log-line.err { color: #f48771; }
    .log-line.warn { color: #e5c07b; }
    .log-line.ok { color: #98c379; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <span>⚙️ esbuild 后端编译 · 编辑左侧文件自动重编译</span>
      <span id="status" class="status">未连接</span>
    </header>
    <div id="files"><div class="placeholder">加载中…</div></div>
    <div id="editor"></div>
    <div id="preview"><div class="placeholder">等待首次编译…</div></div>
    <div id="log"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
